# ⚠️ 임시 조치 (Temporary workaround)
# GitHub Actions 배포 API 방식(actions/deploy-pages)이 deploy job에서
# 매번 정확히 ~10분 지점에 원인 불명으로 타임아웃/실패하는 문제가 반복되어
# (build job은 항상 정상 성공), GitHub Support 문의 회신을 받을 때까지
# 브랜치 기반(gh-pages) 배포 방식으로 임시 전환함.
# 문제가 해결되면 deploy.yml.bak을 참고하여 원래 방식으로 되돌릴 것.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: ./out

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
